name: Build Ethiopian Dama APK

# Builds the release APK automatically on every push.
# No binary Gradle wrapper needs to be committed: the Android platform
# shell is generated on the runner with `flutter create .` from the pure
# Dart sources in this repository (lib/main.dart + pubspec.yaml).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The runner image ships several big toolchains this build never uses;
      # removing them keeps the disk comfortably below the 14 GB limit.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # Generate the Android platform files only when they are missing.
      # `flutter create .` preserves our existing pubspec.yaml and
      # lib/main.dart and only adds the Android shell (including a fresh
      # Gradle wrapper, so nothing binary is committed to the repo).
      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            echo "android/ missing -> generating with flutter create"
            flutter create --org com.henok.dama --project-name ethiopian_dama --platforms android .
          else
            echo "android/ already present -> skipping flutter create"
          fi
          # Remove any auto-generated template test; our smoke tests stay.
          rm -f test/widget_test.dart || true

      # The generated release manifest has no network permissions; the
      # hotspot multiplayer (TCP on 4545) needs them. Also set the Amharic
      # app label.
      - name: Patch AndroidManifest (network permissions + Amharic label)
        run: |
          python3 - <<'PY'
          import io

          path = "android/app/src/main/AndroidManifest.xml"
          with io.open(path, encoding="utf-8") as f:
              xml = f.read()

          perms = (
              '<uses-permission android:name="android.permission.INTERNET"/>'
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>'
              '<uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>'
          )
          if "android.permission.INTERNET" not in xml:
              # Insert before the first <application ...> opening tag.
              idx = xml.find("<application")
              if idx == -1:
                  raise SystemExit("No <application> tag found in manifest!")
              xml = xml[:idx] + perms + xml[idx:]

          xml = xml.replace(
              'android:label="ethiopian_dama"',
              'android:label="የኢትዮጵያ ዳማ Pro"',
          )

          with io.open(path, "w", encoding="utf-8") as f:
              f.write(xml)
          print("Patched:", path)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Run smoke tests
        run: flutter test

      # Gradle auto-installs the NDK that Flutter's template requires, but a
      # flaky runner download can corrupt the zip ("unknown archive"). We
      # pre-install it with retries so the release build is reliable.
      - name: Pre-install Android NDK (with retries)
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          NDK_VERSION="$(grep -oP "const ndkVersion = '\K[^']+" \
            "$FLUTTER_ROOT/packages/flutter_tools/lib/src/android/gradle_utils.dart" || true)"
          if [ -z "$NDK_VERSION" ]; then
            NDK_VERSION="28.2.13676358"
          fi
          echo "Flutter default NDK: $NDK_VERSION"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          for i in 1 2 3 4; do
            echo "sdkmanager install attempt $i..."
            if yes | "$SDKMANAGER" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1; then
              echo "NDK $NDK_VERSION installed on attempt $i"
              break
            fi
            echo "attempt $i failed; retrying in 15s"
            sleep 15
          done
          "$SDKMANAGER" --list_installed 2>/dev/null | grep -i "ndk" || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ethiopian-dama-pro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
